[package]
name = "kimi-session-restore"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "List and load Kimi Code CLI session files (wire.jsonl) for context restoration"
repository = "https://github.com/ZENG3LD/session-restore"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
