[package]
name = "codex-session-restore"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "List and load Codex CLI session files for context restoration"
repository = "https://github.com/ZENG3LD/session-restore"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
